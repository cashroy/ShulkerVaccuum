name: Build plugin

# Every push to main builds the jar. When the <version> in pom.xml hasn't been released yet,
# it also publishes a GitHub release (tag v<version>) with the jar and resource pack, and,
# once MODRINTH_TOKEN (secret) and MODRINTH_PROJECT_ID (variable) are set, a Modrinth version.
# To release: bump <version> in pom.xml, update .github/release-notes.md, push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Minecraft versions the plugin supports (oldest and newest). Modrinth lists every release in between.
env:
  MC_MIN: '1.17'
  MC_MAX: '26.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: ShulkerVaccuum
          path: plugin/target/ShulkerVaccuum-*.jar

  # The released jar is built against the oldest API. This makes sure the same code
  # still compiles against the newest Paper API, so nothing it uses has been removed.
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile against Paper 26.3
        run: >
          mvn -B compile
          -Dcommon.java=25 -Dcommon.api.groupId=io.papermc.paper -Dcommon.api.artifactId=paper-api -Dcommon.api.version=26.3.build.142-beta
          -Dskins.java=25 -Dskins.api.groupId=io.papermc.paper -Dskins.api.artifactId=paper-api -Dskins.api.version=26.3.build.142-beta

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, compat]
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || secrets.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true' || (env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != '')
        with:
          name: ShulkerVaccuum
          path: dist

      - name: GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.jar ShulkerVaccuum-pack.zip \
            --target "$GITHUB_SHA" \
            --title "ShulkerVaccuum $VERSION" \
            --notes-file .github/release-notes.md

      # Uploads a version to Modrinth when it's a new GitHub release, or when Modrinth can be
      # checked and doesn't have it yet. If the check fails, it only uploads new releases,
      # so ordinary pushes never create duplicate Modrinth versions.
      - name: Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEW_RELEASE: ${{ steps.version.outputs.new }}
        run: |
          version="$VERSION"
          ua="cashroy/ShulkerVaccuum (GitHub Actions)"
          if versions="$(curl -sS --fail -H "User-Agent: $ua" -H "Authorization: $MODRINTH_TOKEN" \
              "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/version")"; then
            if jq -e --arg v "$version" 'any(.[]; .version_number == $v)' <<<"$versions" >/dev/null; then
              echo "Modrinth already has $version."
              exit 0
            fi
          elif [ "$NEW_RELEASE" != "true" ]; then
            echo "Couldn't list Modrinth versions and $version isn't a new release; not uploading."
            exit 0
          fi
          jar="$(ls dist/*.jar | head -n 1)"
          # Every full release from MC_MIN to MC_MAX, using Modrinth's own version list.
          game_versions="$(curl -sS --fail -H "User-Agent: $ua" https://api.modrinth.com/v2/tag/game_version \
            | jq -c --arg min "$MC_MIN" --arg max "$MC_MAX" '
                (map(select(.version == $min))[0].date) as $from
                | (map(select(.version == $max))[0].date) as $to
                | [.[] | select(.version_type == "release" and .date >= $from and .date <= $to) | .version]')"
          echo "Minecraft versions: $game_versions"
          [ "$(jq length <<<"$game_versions")" -gt 0 ] || { echo "No game versions found between $MC_MIN and $MC_MAX"; exit 1; }
          # Written to a file: curl -F would treat any ';' in the release notes as a separator.
          jq -n --arg v "$version" --arg project "$MODRINTH_PROJECT_ID" --argjson games "$game_versions" --rawfile notes .github/release-notes.md '{
            name: ("ShulkerVaccuum " + $v),
            version_number: $v,
            changelog: $notes,
            dependencies: [],
            game_versions: $games,
            version_type: "beta",
            loaders: ["bukkit", "spigot", "paper", "purpur"],
            featured: true,
            project_id: $project,
            file_parts: ["jar"],
            primary_file: "jar"
          }' > modrinth-version.json
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: $ua" \
            -F "data=<modrinth-version.json;type=application/json" \
            -F "jar=@$jar;type=application/java-archive"
