name: Build plugin

# Every push to main builds the jar. When the <version> in pom.xml hasn't been released yet,
# it also publishes a GitHub release (tag v<version>) with the jar and resource pack, and,
# once MODRINTH_TOKEN (secret) and MODRINTH_PROJECT_ID (variable) are set, a Modrinth version.
# To release: bump <version> in pom.xml, update .github/release-notes.md, push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: ShulkerVaccuum
          path: target/ShulkerVaccuum-*.jar

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || secrets.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true' || (env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != '')
        with:
          name: ShulkerVaccuum
          path: dist

      - name: GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.jar ShulkerVaccuum-pack.zip \
            --target "$GITHUB_SHA" \
            --title "ShulkerVaccuum $VERSION" \
            --notes-file .github/release-notes.md

      # Publishes any version Modrinth doesn't have yet, so adding the token later
      # still uploads the current release (re-run from Actions > Build plugin > Run workflow).
      - name: Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          ua="cashroy/ShulkerVaccuum (GitHub Actions)"
          # Authorised so unapproved (draft) projects are visible too.
          if curl -sS --fail -H "User-Agent: $ua" -H "Authorization: $MODRINTH_TOKEN" \
              "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/version" \
              | jq -e --arg v "$version" 'any(.[]; .version_number == $v)' >/dev/null; then
            echo "Modrinth already has $version."
            exit 0
          fi
          jar="$(ls dist/*.jar | head -n 1)"
          # Written to a file: curl -F would treat any ';' in the release notes as a separator.
          jq -n --arg v "$version" --arg project "$MODRINTH_PROJECT_ID" --rawfile notes .github/release-notes.md '{
            name: ("ShulkerVaccuum " + $v),
            version_number: $v,
            changelog: $notes,
            dependencies: [],
            game_versions: ["26.3"],
            version_type: "beta",
            loaders: ["paper", "purpur"],
            featured: true,
            project_id: $project,
            file_parts: ["jar"],
            primary_file: "jar"
          }' > modrinth-version.json
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: $ua" \
            -F "data=<modrinth-version.json;type=application/json" \
            -F "jar=@$jar;type=application/java-archive"
